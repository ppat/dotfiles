---
name: homebrew-maintenance-test

on:
  pull_request:
    paths:
    - '.chezmoiscripts/run_before_10_homebrew.sh.tmpl'
    - '.chezmoiscripts/run_after_30_docker.sh.tmpl'
    - '.chezmoiscripts/run_after_31_macos_gui_apps.sh.tmpl'
    - '.chezmoitemplates/homebrew-maintenance.sh'
    - '.chezmoitemplates/homebrew.env'
    - '.chezmoitemplates/script_header.sh'
    - 'Brewfile*'
    - 'tests/homebrew/**'
    - '.github/workflows/homebrew-maintenance-test.yaml'
  schedule:
  - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  homebrew-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Test Homebrew maintenance with mocked Brew
      run: bash tests/homebrew/unit.sh

  homebrew-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Test native Homebrew failure recovery
      run: |
        export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
        brew update
        bash tests/homebrew/integration.sh
