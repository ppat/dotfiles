[tools]
bun            = "1.3.14"
cargo-binstall = "1.21.1"
crane          = "0.21.8"
go             = "1.26.5"
glow           = "2.1.2"
node           = "24.18.1"
rust           = "1.95.0"
terraform      = "1.6.6"
usage          = "3.6.0"
uv             = "0.11.33"

"npm:@anthropic-ai/claude-code" = "2.1.224"
"npm:@upstash/context7-mcp"     = "3.2.5"
"npm:ccstatusline"              = "2.2.27"
"npm:markdownlint-cli2"         = "0.23.2"

"pipx:pre-commit"   = "4.6.1"
"pipx:yamllint"     = "1.38.0"

[settings]
experimental                        = true
trusted_config_paths                = ["~/code"]
idiomatic_version_file_enable_tools = []

[settings.npm]
package_manager = "bun"
[settings.pipx]
uvx = true

[[env]]
_.file = ".env"
# This should be loaded to env as needed
# [[env]]
# _.file = { path = "~/.env.secrets", redact = true }
[[env]]
_.file = "~/.env.overrides"
