[tools]
act                       = "0.2.89"
actionlint                = "1.7.12"
atuin                     = "18.23.0"
bat                       = "0.26.1"
bitwarden                 = "2026.7.0"
bitwarden-secrets-manager = "2.1.0"
btop                      = { version = "1.4.7", os = ["linux"] }                                                       # no darwin asset in aqua registry
bun                       = "1.4.2"
cargo-binstall            = "1.24.0"
coder                     = "2.36.7"
crane                     = "0.22.1"
delta                     = "0.19.2"
duf                       = "0.9.1"
dust                      = "1.2.6"
fd                        = "10.5.0"
flux2                     = "2.9.6"
fzf                       = "0.74.4"
gh                        = "2.102.0"
gitleaks                  = "8.30.1"
go                        = "1.27.1"
glow                      = "3.0.0"
hadolint                  = "2.15.1"
herdr                     = "0.9.3"
helm                      = "4.3.0"
hyperfine                 = "1.20.0"
jq                        = "1.8.2"
k9s                       = "0.51.0"
kind                      = "0.33.0"
krew                      = { version = "0.5.0", postinstall = "ln -sf krew \"$MISE_TOOL_INSTALL_PATH/kubectl-krew\"" }
kubeconform               = "0.8.0"
kubectl                   = "1.36.5"
kustomize                 = "5.8.1"
kyverno                   = "1.19.1"
lychee                    = "0.24.2"
node                      = "24.21.0"
pre-commit                = "4.6.2"
python                    = "3.14.8"
ripgrep                   = "15.2.0"
rust                      = "1.99.0"
shellcheck                = "0.11.0"
talosctl                  = "1.14.2"
usage                     = "6.12.1"
uv                        = "0.12.24"
yamllint                  = "1.38.0"
yq                        = "4.54.1"

"npm:@anthropic-ai/claude-code" = "2.1.295"
"npm:@openai/codex"             = "0.160.0"
"npm:ccstatusline"              = "2.2.30"
"npm:ccusage"                   = "20.0.26"
"npm:markdownlint-cli2"         = "0.23.3"
"npm:skills"                    = "1.7.1"

# CLI binaries (formerly managed by aqua) -- pinned + checksum-verified via mise.lock
# Versions are bare (no "v"/"cli-v"/"bws-v"/"kustomize/v" prefix) for consistency: verified that mise's
# aqua backend resolves the exact same artifact/checksum regardless of prefix, since it reconstructs the
# real upstream tag from the aqua registry's own per-package version template.
"aqua:dalance/procs"    = "0.14.12"
"aqua:kyverno/chainsaw" = "0.2.15"

[settings]
experimental                        = true
idiomatic_version_file_enable_tools = []
lockfile                            = true

[settings.npm]
package_manager = "bun"
[settings.pipx]
uvx = true

[[env]]
_.file = ".env"
# This should be loaded to env as needed
# [[env]]
# _.file = { path = "~/.env.secrets", redact = true }
[[env]]
_.file = "~/.env.overrides"
