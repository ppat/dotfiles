"npm:@openai/codex"             = "0.152.1"
"npm:ccstatusline"              = "2.2.29"
"npm:ccusage"                   = "20.0.20"
"npm:markdownlint-cli2"         = "0.23.2"
"npm:skills"                    = "1.5.24"

# CLI binaries (formerly managed by aqua) -- pinned + checksum-verified via mise.lock
# Versions are bare (no "v"/"cli-v"/"bws-v"/"kustomize/v" prefix) for consistency: verified that mise's
# aqua backend resolves the exact same artifact/checksum regardless of prefix, since it reconstructs the
# real upstream tag from the aqua registry's own per-package version template.
"aqua:aristocratos/btop"    = { version = "1.4.7", os = ["linux"] }                                                       # no darwin asset in aqua registry
"aqua:dalance/procs"        = "0.14.12"
"aqua:kubernetes-sigs/krew" = { version = "0.5.0", postinstall = "ln -sf krew \"$MISE_TOOL_INSTALL_PATH/kubectl-krew\"" }
"aqua:kyverno/chainsaw"     = "0.2.15"

[settings]
experimental                        = true
trusted_config_paths                = ["~/code"]
idiomatic_version_file_enable_tools = []
lockfile                            = true

[settings.npm]
package_manager = "bun"
[settings.pipx]
uvx = true

[[env]]
_.file = ".env"
# This should be loaded to env as needed
# [[env]]
# _.file = { path = "~/.env.secrets", redact = true }
[[env]]
_.file = "~/.env.overrides"
