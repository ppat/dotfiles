[tools]
act                       = "0.2.98"
actionlint                = "1.7.12"
atuin                     = "18.24.8"
bat                       = "0.26.1"
bitwarden                 = "2026.7.0"
bitwarden-secrets-manager = "2.1.0"
btop                      = { version = "1.4.8", os = ["linux"] }                                                       # no darwin asset in aqua registry
bun                       = "1.4.2"
cargo-binstall            = "1.27.0"
coder                     = "2.39.4"
crane                     = "0.22.1"
delta                     = "0.20.1"
duf                       = "0.9.1"
dust                      = "1.2.7"
fd                        = "10.5.2"
flux2                     = "2.10.0"
fzf                       = "0.75.0"
gh                        = "2.105.0"
gitleaks                  = "8.30.1"
go                        = "1.27.1"
glow                      = "3.0.0"
hadolint                  = "2.15.1"
herdr                     = "0.9.5"
helm                      = "4.3.2"
hyperfine                 = "2.0.0"
jq                        = "1.8.2"
k9s                       = "0.51.0"
kind                      = "0.33.0"
krew                      = { version = "0.5.0", postinstall = "ln -sf krew \"$MISE_TOOL_INSTALL_PATH/kubectl-krew\"" }
kubeconform               = "0.8.0"
kubectl                   = "1.37.2"
kustomize                 = "5.8.1"
kyverno                   = "1.20.0"
lychee                    = "0.24.2"
markdownlint-cli2         = "0.24.1"
node                      = "26.13.1"
pre-commit                = "4.7.0"
python                    = "3.15.2"
ripgrep                   = "15.2.0"
rust                      = "1.99.1"
shellcheck                = "0.11.0"
talosctl                  = "1.14.6"
usage                     = "7.4.0"
uv                        = "0.13.9"
yamllint                  = "1.38.0"
yq                        = "4.54.3"

"npm:@anthropic-ai/claude-code" = "2.1.327"
"npm:@openai/codex"             = "0.169.1"
"npm:ccstatusline"              = "2.2.34"
"npm:ccusage"                   = "20.0.51"
"npm:skills"                    = "1.9.0"

# CLI binaries (formerly managed by aqua) -- pinned + checksum-verified via mise.lock
# Versions are bare (no "v"/"cli-v"/"bws-v"/"kustomize/v" prefix) for consistency: verified that mise's
# aqua backend resolves the exact same artifact/checksum regardless of prefix, since it reconstructs the
# real upstream tag from the aqua registry's own per-package version template.
"aqua:dalance/procs"    = "0.14.12"
"aqua:kyverno/chainsaw" = "0.2.15"

[settings]
experimental                        = true
idiomatic_version_file_enable_tools = []
lockfile                            = true

[settings.npm]
package_manager = "bun"
[settings.pypi]
uvx = true

[[env]]
_.file = ".env"
# This should be loaded to env as needed
# [[env]]
# _.file = { path = "~/.env.secrets", redact = true }
[[env]]
_.file = "~/.env.overrides"
